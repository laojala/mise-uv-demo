[tools]
python = "3.14.10"
uv = "0.11.7"
"pypi:ruff" = "0.17.5"
node = "26.13.1"            # the frontend
terraform = "1.17.2"        # the cloud

[settings]
python.uv_venv_auto = "create|source"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
APP_GREETING = "Hello from mise!"

[hooks]
postinstall = [
  'mise -C "{{ config_root }}" exec -- uv sync --locked',
  'mise -C "{{ config_root }}/older-python" install',
]

[tasks.test]
run = "uv run pytest"

[tasks.lint]
run = "ruff check ."

[tasks.fmt]
run = "ruff format ."

[tasks.hello]
run = "uv run mise-uv-demo"

[tasks.app]
run = "uv run streamlit run src/mise_uv_demo/app.py"
